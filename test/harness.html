<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>记账本 · 自动化测试</title>
<link rel="stylesheet" href="../android/assets/www/css/app.css" />
<style>
  #report { position: fixed; inset: 0; z-index: 9999; background: #0b0d11;
            color: #ddd; font: 12px/1.6 monospace; padding: 12px; overflow: auto; }
  .pass { color: #3ddc97; }
  .fail { color: #ff5c68; font-weight: bold; }
  .sec  { color: #6cf; margin-top: 10px; }
  pre { margin: 0; white-space: pre-wrap; }
</style>
</head>
<body>

<div id="appbg" aria-hidden="true"></div>

<div class="app">
  <header class="topbar">
    <div class="brand"><span class="logo">💰</span><span>大肥鱼记账本</span></div>
    <div class="spacer"></div>
    <button class="icon-btn" data-act="openSettings">⚙️</button>
  </header>
  <main id="view"></main>
  <div class="bulk-bar" id="bulkbar" hidden></div>
  <nav class="tabbar" id="tabbar"></nav>
</div>
<div class="sheet-mask" id="sheet-mask" data-act="closeSheet"></div>
<div class="sheet" id="sheet"></div>
<div id="toast"></div>

<script>
  // 捕获所有运行期错误，供测试报告使用
  window.__errors = [];
  window.addEventListener('error', function (e) {
    window.__errors.push((e.message || 'error') + ' @ ' + (e.filename || '') + ':' + (e.lineno || 0));
  });
  window.addEventListener('unhandledrejection', function (e) {
    window.__errors.push('unhandled rejection: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });

  /* ----------------------------------------------------------------
     模拟安卓原生桥。
     这样 Store.HAS_NATIVE 为 true，原生分支（文件存储、图片、
     桌面图标切换、待确认收付款收件箱）都能被真正测到。
     ---------------------------------------------------------------- */
  window.__nativeFiles = {};
  window.__images = {};
  window.__payInbox = [];
  window.__launcherIcon = 'whale_q_blue';
  window.__notifAccess = false;
  window.__httpReply = '{"status":200,"body":"{}"}';

  window.Android = {
    fsReady: function () { return true; },
    fsRead: function (f) {
      return Object.prototype.hasOwnProperty.call(window.__nativeFiles, f)
        ? window.__nativeFiles[f] : null;
    },
    fsWrite: function (f, c) { window.__nativeFiles[f] = c; return true; },
    fsExists: function (f) { return Object.prototype.hasOwnProperty.call(window.__nativeFiles, f); },
    fsDelete: function (f) { delete window.__nativeFiles[f]; return true; },
    fsList: function () { return '[]'; },

    saveImage: function (name, dataUrl) { window.__images[name] = dataUrl; return true; },
    loadImage: function (name) {
      return Object.prototype.hasOwnProperty.call(window.__images, name)
        ? window.__images[name] : null;
    },
    deleteImage: function (name) { delete window.__images[name]; return true; },

    httpRequest: function (method, url, headers, body) {
      window.__lastHttp = {
        method: method, url: url,
        headers: (function () { try { return JSON.parse(headers || '{}'); } catch (e) { return {}; } })(),
        body: body
      };
      return window.__httpReply;
    },
    copy: function () { return true; },
    share: function () { return true; },
    toast: function () {},
    dataDir: function () { return '/data/test/ledger'; },

    setLauncherIcon: function (k) { window.__launcherIcon = k; return true; },
    getLauncherIcon: function () { return window.__launcherIcon; },

    canPinCustomIcon: function () { return window.__canPin !== false; },
    hasPinnedCustomIcon: function () { return !!window.__pinned; },
    pinCustomIcon: function (dataUrl, label) {
      window.__pinned = { dataUrl: dataUrl, label: label };
      return window.__pinResult !== false;
    },
    loadCustomIcon: function () { return ''; },

    hasPayAccess: function () { return window.__notifAccess; },
    openPayAccessSettings: function () { return true; },
    listPayInbox: function () { return JSON.stringify(window.__payInbox); },
    removePayInbox: function (idsJson) {
      var ids = JSON.parse(idsJson);
      window.__payInbox = window.__payInbox.filter(function (p) {
        return ids.indexOf(p.id) < 0;
      });
      return true;
    },
    clearPayInbox: function () { window.__payInbox = []; return true; },
    injectTestPay: function (src, type, amt, content) {
      window.__payInbox.push({
        id: 'inj' + window.__payInbox.length, ts: Date.now(),
        source: src, type: type, amount: amt, content: content, raw: '[inject]'
      });
      return true;
    },
    testPayParse: function (pkg, title, body) {
      // 模拟原生 PayParser 的行为，够用来验证自检面板的交互
      var all = String(title || '') + ' ' + String(body || '');
      var m = /[¥￥]\s*([\d,]+(?:\.\d{1,2})?)/.exec(all);
      if (!m) return '{"ok":false}';
      var amt = parseFloat(m[1].replace(/,/g, ''));
      var isIncome = /收款到账|已到账|到账|退款/.test(all);
      return JSON.stringify({
        ok: true,
        source: pkg === 'com.tencent.mm' ? '微信' : '支付宝',
        type: isIncome ? 'income' : 'expense',
        amount: amt,
        content: '微信付款'
      });
    }
  };
</script>

<script src="../android/assets/www/js/theme.js"></script>
<script src="../android/assets/www/js/classify.js"></script>
<script src="../android/assets/www/js/charts.js"></script>
<script src="../android/assets/www/js/store.js"></script>
<script src="../android/assets/www/js/calendar.js"></script>
<script src="../android/assets/www/js/ai.js"></script>
<script src="../android/assets/www/js/import.js"></script>
<script src="../android/assets/www/js/app.js"></script>

<script>
(function () {
  var out = [];
  var pass = 0, fail = 0;
  var currentSection = '(尚未开始)';

  function log(html) { out.push(html); }
  function sec(t) { currentSection = t; log('<div class="sec">── ' + t + ' ──</div>'); }

  /** 安全点击：找不到元素时记为失败而不是抛异常中断整轮测试 */
  function clickEl(sel, name) {
    var el = document.querySelector(sel);
    if (!el) {
      ok(false, name || ('点击 ' + sel), '找不到元素');
      return false;
    }
    el.click();
    return true;
  }

  function ok(cond, name, extra) {
    if (cond) { pass++; log('<div class="pass">✓ ' + name + (extra ? '  <span style="color:#888">' + extra + '</span>' : '') + '</div>'); }
    else { fail++; log('<div class="fail">✗ ' + name + (extra ? '  → ' + extra : '') + '</div>'); }
  }
  function eq(a, b, name) { ok(String(a) === String(b), name, 'got=' + JSON.stringify(a) + ' want=' + JSON.stringify(b)); }

  function run() {
    // ---------------- 自动分类 ----------------
    sec('自动分类归档识别');
    var cases = [
      ['公司楼下快餐', '餐饮食物'],
      ['星巴克拿铁', '餐饮食物'],
      ['淘宝买衣服', '购物消费'],
      ['地铁通勤', '交通出行'],
      ['房租', '居住住房'],
      ['电影票', '娱乐休闲'],
      ['洗发水', '生活用品'],
      ['药店买感冒药', '医疗健康'],
      ['充话费', '通讯网络'],
      ['买书', '学习成长'],
      ['给妈妈的红包', '人情往来'],
      ['猫粮', '宠物'],
      ['京东买显示器', '数码电器'],
      ['京东买纸巾', '生活用品'],
      ['淘宝买衣服', '购物消费'],
      ['火锅', '餐饮食物'],
      ['理发', '服饰美容'],
      ['酒店住宿', '旅行'],
      ['某个不知道是什么的东西', '其他']
    ];
    cases.forEach(function (c) {
      var r = Classify.classify(c[0], '');
      eq(r.category.name, c[1], '「' + c[0] + '」→ ' + c[1]);
    });

    // 备注参与识别
    var rn = Classify.classify('某某', '和朋友吃火锅');
    eq(rn.category.name, '餐饮食物', '备注命中「火锅」→ 餐饮食物');

    // ---------------- 文本记录格式 ----------------
    sec('文本记录格式 时间 | 分类 | 内容 | 金额');
    Store.clearAll(false);
    Store.addRecord({ date: '2025-03-05', time: '12:30', amount: 25, content: '公司楼下快餐', category: 'food', note: '加了鸡腿' });
    Store.addRecord({ date: '2025-03-05', time: '20:11', amount: 103.5, content: '京东买纸巾', category: 'daily', note: '' });
    var recs = Store.query({});
    var text = Store.toText(recs, { includeNote: false });
    var lines = text.split('\n');
    eq(lines.length, 2, '生成 2 行记录');
    eq(lines[0], '2025-03-05 12:30 | 餐饮食物 | 公司楼下快餐 | -25.00', '第一行格式正确（支出为负）');
    eq(lines[1], '2025-03-05 20:11 | 生活用品 | 京东买纸巾 | -103.50', '第二行格式（两位小数）正确');
    ok(/^\d{4}-\d{2}-\d{2} \d{2}:\d{2} \| .+ \| .+ \| [+-]\d+\.\d{2}$/.test(lines[0]),
       '整体符合正则模板');
    var withNote = Store.toText(recs, { includeNote: true });
    ok(withNote.indexOf('备注：加了鸡腿') > 0, '可附加备注字段');
    ok(withNote.indexOf('【') < 0, '不再出现【】符号');

    // ---------------- 统计 ----------------
    sec('统计与汇总');
    var cats = Store.categoryTotals(recs);
    eq(cats.length, 2, '两个分类');
    eq(cats[0].name, '生活用品', '按金额降序（生活用品最大）');
    eq(cats[0].value, 103.5, '生活用品合计 103.5');
    eq(Store.sumAmount(recs), 128.5, '总支出 128.5');
    var days = Store.dailyTotals(recs, '2025-03-01', '2025-03-07');
    eq(days.length, 7, '补齐 7 天日期轴');
    eq(days[4].value, 128.5, '3-05 当天合计正确');
    eq(days[0].value, 0, '无记录的日子补 0');

    // ---------------- 预算 / 当日剩余额度 ----------------
    sec('预算与当日剩余额度');
    var fixed = new Date(2025, 2, 15);           // 2025-03-15
    Store.clearAll(false);
    Store.saveSettings({ monthlyBudget: 3000, dailyBudget: 100, monthStartDay: 1 });
    Store.addRecord({ date: '2025-03-01', time: '10:00', amount: 500, content: 'a', category: 'other' });
    Store.addRecord({ date: '2025-03-15', time: '10:00', amount: 40, content: 'b', category: 'other' });
    var b = Store.budget(fixed);
    eq(b.period.totalDays, 31, '3 月共 31 天');
    eq(b.period.elapsedDays, 15, '已过 15 天');
    eq(b.period.remainingDays, 17, '剩余 17 天（含今日）');
    eq(b.spentPeriod, 540, '本账期已花 540');
    eq(b.spentToday, 40, '今日已花 40');
    eq(b.spentBeforeToday, 500, '今日之前已花 500');
    eq(b.remaining, 2460, '本账期剩余 2460');
    eq(b.dailyAllowance, Math.round((3000 - 500) / 17 * 100) / 100, '月度平均日可用 = (3000-500)/17');
    eq(b.todayRemaining, Math.round((b.dailyAllowance - 40) * 100) / 100, '今日剩余 = 日均可用 - 今日已花');
    eq(b.todayRemainingByDay, 60, '按日额度剩余 = 100 - 40');

    // 自定义账期起始日
    var p15 = Store.periodOf(new Date(2025, 2, 20), 15);
    eq(p15.startStr, '2025-03-15', '发薪日 15 号：账期 3-15 开始');
    var p15b = Store.periodOf(new Date(2025, 2, 3), 15);
    eq(p15b.startStr, '2025-02-15', '3 号仍属于 2-15 开始的账期');

    // ---------------- 分组 ----------------
    sec('明细分组');
    var groups = Store.groupByDay(Store.query({ from: '2025-03-01', to: '2025-03-31' }));
    eq(groups.length, 2, '两个日期分组');
    eq(groups[0].date, '2025-03-15', '最新日期在前');
    eq(groups[0].total, 40, '分组金额正确');

    // ---------------- 图表 ----------------
    sec('Canvas 图表渲染');
    var cv = document.createElement('canvas');
    cv.width = 300; cv.height = 200;
    document.body.appendChild(cv);
    var chartErr = null;
    try {
      Charts.donut(cv, Store.categoryTotals(recs), { height: 200 });
      Charts.bars(cv, Store.dailyTotals(recs, '2025-03-01', '2025-03-07'), { height: 200 });
      Charts.line(cv, Store.dailyTotals(recs, '2025-03-01', '2025-03-07'), { height: 200 });
      Charts.donut(cv, [], { height: 200 });
      Charts.bars(cv, [], { height: 200 });
    } catch (e) { chartErr = e.message; }
    ok(!chartErr, '三种图表 + 空数据均不抛异常', chartErr || '');

    // ---------------- 目标 ----------------
    sec('省钱目标');
    Store.clearAll(false);
    var g = Store.addGoal({ title: '买相机', target: 10000, saved: 2500, text: '每月存 1500', deadline: '2025-12-31' });
    eq(Store.goals().length, 1, '创建目标成功');
    eq(Store.getGoal(g.id).target, 10000, '目标金额正确');
    Store.depositGoal(g.id, 500);
    eq(Store.getGoal(g.id).saved, 3000, '存入 500 后为 3000');
    Store.updateGoal(g.id, { text: '改了说明', imageId: 'goal_x.jpg' });
    eq(Store.getGoal(g.id).text, '改了说明', '文本可自由修改');
    ok(Store.images.save('t1.jpg', 'data:image/jpeg;base64,AAAA') !== undefined, '图片存储接口可用');

    // ---------------- 界面渲染 ----------------
    sec('界面渲染（DOM 冒烟测试）');
    var view = document.getElementById('view');
    ok(view && view.innerHTML.length > 100, '首页渲染出内容');

    var tabs = ['list', 'stats', 'goals', 'ai', 'add'];
    tabs.forEach(function (t) {
      var btn = document.querySelector('[data-act="tab"][data-tab="' + t + '"]');
      if (!btn) { ok(false, '切换标签 ' + t, '找不到按钮'); return; }
      var errBefore = window.__errors.length;
      btn.click();
      var html = document.getElementById('view').innerHTML;
      ok(html.length > 50 && window.__errors.length === errBefore,
         '标签「' + t + '」渲染正常', 'HTML ' + html.length + ' 字节');
    });

    // 设置面板
    var errB = window.__errors.length;
    document.querySelector('[data-act="openSettings"]').click();
    ok(document.getElementById('sheet').innerHTML.length > 500 &&
       window.__errors.length === errB, '设置面板可打开');
    document.querySelector('[data-act="closeSheet"]').click();

    // 统计页图表
    document.querySelector('[data-act="tab"][data-tab="stats"]').click();
    ok(document.getElementById('mainChart') !== null, '统计页生成了图表 canvas');

    // AI 页在未配置时给出提示
    document.querySelector('[data-act="tab"][data-tab="ai"]').click();
    ok(document.getElementById('view').innerHTML.indexOf('未配置') > 0, 'AI 页未配置时提示正确');

    // ---------------- 接口地址解析 ----------------
    sec('大模型接口地址解析');
    eq(AI.resolveEndpoint('https://api.deepseek.com'), 'https://api.deepseek.com/v1/chat/completions', '根地址补全');
    eq(AI.resolveEndpoint('https://api.deepseek.com/v1'), 'https://api.deepseek.com/v1/chat/completions', '带 /v1 补全');
    eq(AI.resolveEndpoint('https://open.bigmodel.cn/api/paas/v4'), 'https://open.bigmodel.cn/api/paas/v4/chat/completions', '智谱 v4 路径');
    eq(AI.resolveEndpoint('https://x.com/v1/chat/completions'), 'https://x.com/v1/chat/completions', '完整地址不重复拼接');
    eq(AI.resolveEndpoint('https://dashscope.aliyuncs.com/compatible-mode'), 'https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions', '通义 compatible-mode');
    eq(AI.resolveEndpoint('http://192.168.1.9:11434'), 'http://192.168.1.9:11434/v1/chat/completions', '本地 Ollama');

    // 提示词构建
    Store.clearAll(false);
    Store.addRecord({ date: '2025-03-05', time: '12:30', amount: 25, content: '快餐', category: 'food', note: '' });
    var msgs = AI.buildMessages(Store.query({}), '找出不必要的花费');
    ok(msgs.length === 2 && msgs[0].role === 'system' && msgs[1].role === 'user', '提示词结构正确');
    ok(msgs[1].content.indexOf('餐饮食物') > 0, '提示词包含分类汇总');
    ok(msgs[1].content.indexOf('2025-03-05 12:30 | 餐饮食物 | 快餐 | -25.00') > 0, '提示词包含标准格式记录');
    ok(msgs[1].content.indexOf('找出不必要的花费') > 0, '提示词包含用户问题');

    // ---------------- 备份 ----------------
    sec('数据备份与恢复');
    var json = Store.exportJSON();
    ok(json.indexOf('"records"') > 0, '导出 JSON 正常');
    Store.clearAll(false);
    eq(Store.query({}).length, 0, '清空后无记录');
    Store.importJSON(json);
    eq(Store.query({}).length, 1, '恢复后记录回来');

    // ---------------- 端到端 UI 流程 ----------------
    sec('记录详情弹层（编辑流程）');
    Store.clearAll(false);
    var today = Store.util.dateStr(new Date());
    Store.addRecord({ date: today, time: '12:30', amount: 25, content: '快餐', category: 'food', note: '原来备注' });
    document.querySelector('[data-act="tab"][data-tab="list"]').click();
    var row = document.querySelector('[data-act="openRecord"]');
    ok(!!row, '明细页出现记录行');
    if (row) {
      row.click();
      ok(document.getElementById('sheet').classList.contains('on'), '详情弹层已打开');
      ok(document.getElementById('ed-amount') !== null, '弹层含可编辑金额输入框');
      document.getElementById('ed-amount').value = '30';
      document.getElementById('ed-note').value = '修改后的备注';
      document.getElementById('ed-content').value = '公司楼下快餐';
      document.querySelector('[data-act="saveRecord"]').click();
      var edited = Store.query({})[0];
      ok(edited && edited.amount === 30, '编辑后的金额已保存', edited ? edited.amount : 'null');
      ok(edited && edited.note === '修改后的备注', '编辑后的备注已保存');
      ok(!document.getElementById('sheet').classList.contains('on'), '保存后弹层已关闭');
    }

    sec('目标存入 / 取出（界面流程）');
    Store.clearAll(false);
    var g2 = Store.addGoal({ title: '测试目标', target: 1000, saved: 500 });
    document.querySelector('[data-act="tab"][data-tab="goals"]').click();
    var depBtn = document.querySelector('[data-act="deposit"]');
    ok(!!depBtn, '目标卡片上有「存入」按钮');
    depBtn.click();
    ok(document.getElementById('sheet').classList.contains('on'), '存入弹层已打开');
    document.getElementById('dep-amount').value = '100';
    document.querySelector('[data-act="doDeposit"]:not([data-sign])').click();
    ok(Store.getGoal(g2.id).saved === 600, '存入 100 → 600', Store.getGoal(g2.id).saved);

    document.querySelector('[data-act="deposit"]').click();
    document.getElementById('dep-amount').value = '50';
    document.querySelector('[data-act="doDeposit"][data-sign="-1"]').click();
    ok(Store.getGoal(g2.id).saved === 550, '取出 50 → 550', Store.getGoal(g2.id).saved);

    sec('保存一笔新支出（记账表单流程）');
    Store.clearAll(false);
    document.querySelector('[data-act="tab"][data-tab="add"]').click();
    var amtInput = document.querySelector('[data-bind="form.amount"]');
    var contentInput = document.querySelector('[data-bind="form.content"]');
    ok(!!amtInput && !!contentInput, '记账表单包含金额与内容输入框');
    amtInput.value = '88.5';
    amtInput.dispatchEvent(new window.Event('input', { bubbles: true }));
    contentInput.value = '和朋友吃火锅';
    contentInput.dispatchEvent(new window.Event('input', { bubbles: true }));
    ok(document.getElementById('suggest-expense').textContent.indexOf('餐饮食物') > 0,
       '输入内容后自动给出分类建议',
       document.getElementById('suggest-expense').textContent.trim());
    document.querySelector('[data-act="save"]').click();
    var savedRec = Store.query({})[0];
    ok(!!savedRec && savedRec.amount === 88.5, '金额已保存', savedRec ? savedRec.amount : 'null');
    ok(!!savedRec && savedRec.content === '和朋友吃火锅', '内容已保存');
    ok(!!savedRec && savedRec.category === 'food', '自动归档为餐饮食物', savedRec ? savedRec.category : 'null');
    ok(document.querySelector('[data-bind="form.amount"]').value === '', '保存后表单已清空');

    // ---------------- 实际发出的 HTTP 请求 ----------------
    sec('实际发出的请求内容（拦截验证）');
    Store.clearAll(false);
    Store.saveSettings({
      llm: {
        preset: 'deepseek', base: 'https://api.deepseek.com',
        key: 'sk-abcdef1234567890', model: 'deepseek-chat',
        stream: false, temperature: 0.6, maxTokens: 1600
      }
    });

    var origFetch = window.fetch;
    function stubFetch(status, bodyText) {
      var cap = { calls: [] };
      window.fetch = function (url, opts) {
        cap.calls.push({
          url: url,
          headers: (opts && opts.headers) || {},
          body: (opts && opts.body) || ''
        });
        return Promise.resolve({
          ok: status >= 200 && status < 300,
          status: status,
          text: function () { return Promise.resolve(bodyText); }
        });
      };
      return cap;
    }

    // 1) 测试连接（非流式）—— 真机上走原生桥，这里验证原生分支
    window.__lastHttp = null;
    window.__httpReply = '{"status":200,"body":"{\\"choices\\":[{\\"message\\":{\\"content\\":\\"连接成功\\"}}]}"}';
    AI.testConnection(function () {});
    ok(!!window.__lastHttp, '测试连接通过原生桥发出了请求');

    // ---------------- 输出 ----------------

  // 等 app.js 初始化完成
  setTimeout(function () {
    try { run(); }
    catch (e) {
      var rep = document.createElement('div');
      rep.id = 'report';
      rep.innerHTML = '<div class="fail">测试框架异常：' + e.message +
        '<br>发生在章节：「' + currentSection + '」' +
        '<br>已经跑了 ' + pass + ' 项通过 / ' + fail + ' 项失败</div>' +
        '<pre>' + (e.stack || '') + '</pre>' +
        '<div class="sec" style="margin-top:12px">──── 异常前已执行的断言 ────</div>' +
        out.join('\n');
      document.body.appendChild(rep);
      document.title = 'RESULT pass=0 fail=99';
    }
  }, 400);
