<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no,email=no,address=no" />
  <meta name="color-scheme" content="dark light" />
  <title>大肥鱼记账本</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>

  <!-- 自定义背景图的容器，永远在最底层 -->
  <div id="appbg" aria-hidden="true"></div>

  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="logo">💰</span><span>大肥鱼记账本</span></div>
      <div class="spacer"></div>
      <button class="icon-btn" data-act="openSettings" title="设置">⚙️</button>
    </header>

    <main id="view"></main>

    <div class="bulk-bar" id="bulkbar" hidden></div>

    <nav class="tabbar" id="tabbar"></nav>
  </div>

  <div class="sheet-mask" id="sheet-mask" data-act="closeSheet"></div>
  <div class="sheet" id="sheet"></div>
  <div id="toast"></div>

  <script src="js/theme.js"></script>
  <script src="js/classify.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/store.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/import.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
